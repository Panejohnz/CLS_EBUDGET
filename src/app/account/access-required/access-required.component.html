<main class="access-required-page">
  <div class="access-required-orb access-required-orb-left"></div>
  <div class="access-required-orb access-required-orb-right"></div>
  <section class="access-required-card" aria-labelledby="access-required-title">
    <header class="access-required-brand">
      <img src="assets/images/Logo_PNG_735.png" alt="สำนักงานคณะกรรมการป้องกันและปราบปรามการทุจริตในภาครัฐ">
      <div><span>ระบบบริหารงานคลัง งบประมาณ และสินทรัพย์</span><strong>การเข้าถึงระบบถูกจำกัด</strong></div>
    </header>
    <div class="access-denied-mark" aria-hidden="true"><span class="access-denied-slash"></span><i
        class="ri-lock-2-line"></i></div>
    <div class="access-required-content">
      <span class="access-required-eyebrow"><i class="ri-shield-keyhole-line"></i> ไม่อนุญาตให้เข้าถึง</span>
      <h1 id="access-required-title">กรุณาเข้าสู่ระบบก่อน</h1>
      <p>ลิงก์นี้เป็นหน้าภายในระบบ คุณต้องยืนยันตัวตนก่อนจึงจะสามารถดูข้อมูลและใช้งานต่อได้</p>
    </div>
    <button type="button" class="btn access-login-button" (click)="goToLogin()"><i class="ri-login-box-line"></i>
      กลับไปเข้าสู่ระบบ <i class="ri-arrow-right-line access-login-arrow"></i></button>
    <p class="access-required-note"><i class="ri-information-line"></i> หากเข้าสู่ระบบแล้ว โปรดลองเปิดลิงก์อีกครั้ง</p>
  </section>
</main>
