<div class="card">
  <div class="card-header shared-page-header">
    <h4 class="card-title mb-0 flex-grow-1 text-white">ตั้งค่าการเปิด/ปิดปุ่มบันทึก</h4>
  </div>

  <div class="card-body">
    <p class="text-muted mb-3">ปิดแล้วผู้ใช้จะไม่สามารถกดปุ่มเพิ่มข้อมูลในเมนูนั้นได้</p>

    <div class="table-responsive">
      <table class="table table-bordered align-middle mb-0">
        <thead class="table-header">
          <tr>
            <th class="text-center" style="width: 70px;">ลำดับ</th>
            <th>เมนู</th>
            <!-- <th>เส้นทาง</th> -->
            <th class="text-center" style="width: 150px;">สถานะปุ่มเพิ่ม</th>
            <th class="text-center" style="width: 130px;">บันทึก</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let control of controls; let i = index">
            <td class="text-center">{{ i + 1 }}</td>
            <td>{{ control.Menu_Name }}</td>
            <!-- <td><code>{{ control.Route_Path }}</code></td> -->
            <td class="text-center">
              <div class="form-check form-switch d-inline-flex align-items-center gap-2 mb-0">
                <input class="form-check-input" type="checkbox" role="switch"
                  [id]="'save-control-' + i" [(ngModel)]="control.Can_Save">
                <label class="form-check-label" [for]="'save-control-' + i">
                  {{ control.Can_Save ? 'เปิดเพิ่ม' : 'ปิดเพิ่ม' }}
                </label>
              </div>
            </td>
            <td class="text-center">
              <button type="button" class="btn btn-success btn-sm" [disabled]="savingCode === control.Menu_Code"
                (click)="save(control)">
                <span *ngIf="savingCode !== control.Menu_Code">บันทึก</span>
                <span *ngIf="savingCode === control.Menu_Code" class="spinner-border spinner-border-sm"></span>
              </button>
            </td>
          </tr>
          <tr *ngIf="!loading && controls.length === 0">
            <td colspan="5" class="text-center text-muted">ไม่พบเมนู</td>
          </tr>
          <tr *ngIf="loading">
            <td colspan="5" class="text-center"><span class="spinner-border spinner-border-sm me-2"></span>กำลังโหลดข้อมูล</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
