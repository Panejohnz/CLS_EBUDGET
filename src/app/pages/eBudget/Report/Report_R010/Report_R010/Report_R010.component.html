<div class="report-page-shell">
  <div class="report-toolbar">
    <div class="report-title-block">
      
      <h5 class="report-title">{{ reportTitle }}</h5>
    </div>
    
  </div>

  <div class="report-frame-card">
    <div class="report-frame-status">
      
    </div>
    <div class="report-iframe-wrap">
      <iframe
        *ngIf="reportUrl"
        class="report-iframe"
        [src]="reportUrl"
        [title]="reportTitle"
      ></iframe>
    </div>
  </div>
</div>
